aid: dyna
name: Dyna
description: 'DYNA Robotics builds commercial-grade, general-purpose robots for real-world
  automation across factories, restaurants, and laundromats. Its flagship DYNA-1 is
  a dual-arm robotic system powered by a vision-language-action (VLA) foundation model,
  running 24/7 in production with a reported 99.4% success rate and human-level dexterity.
  The company positions itself as building embodied AGI through high-performance robots
  that adapt across environments and learn new skills rapidly with minimal custom engineering.
  Backed by CRV, DYNA closed a $120M Series A in 2025. No public API, developer portal,
  or machine-readable API surface has been published to date; this profile tracks the
  company as an AI/robotics lead in the API Evangelist network.'
